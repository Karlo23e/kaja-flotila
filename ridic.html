<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KaJa - Řidičská zóna</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest-ridic.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KaJa Řidič">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="https://img.icons8.com/?size=512&id=49429&format=png&color=000000">
  <link rel="apple-touch-icon" href="https://img.icons8.com/?size=512&id=49429&format=png&color=000000">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 sm:p-6 font-sans pb-12">

  <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
  <div id="login-screen" class="max-w-md mx-auto mt-12 bg-slate-800/90 border border-slate-700 rounded-2xl p-6 shadow-2xl space-y-5">
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-amber-400 flex items-center justify-center gap-2">
        <i data-lucide="truck"></i> KaJa Řidič
      </h1>
      <p class="text-xs text-slate-400">Přihlášení do řidičské zóny</p>
    </div>
    <div id="login-loader" class="text-center py-4 text-xs text-slate-400">Načítám seznam řidičů...</div>
    <form id="login-form" onsubmit="prihlasitRidice(event)" class="space-y-4 hidden text-xs">
      <div>
        <label class="block text-slate-400 mb-1">Vyber své jméno</label>
        <select id="login-select-ridic" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-white focus:border-amber-400">
          <option value="">-- Vyber ze seznamu --</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-400 mb-1">Přístupový PIN</label>
        <input type="password" id="login-pin" required maxlength="6" placeholder="Zadej PIN" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-amber-400 font-mono tracking-widest">
      </div>
      <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold p-3.5 rounded-xl text-sm shadow">Přihlásit se</button>
    </form>
  </div>

  <!-- MODÁLNÍ OKNO PRO ZMĚNU PINU -->
  <div id="modal-zmena-pinu" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-amber-500/50 w-full max-w-md rounded-2xl p-6 space-y-4">
      <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2"><i data-lucide="shield-alert"></i> Nutná změna PINu</h3>
      <p class="text-xs text-slate-300">Používáš výchozí PIN (1111). Zvol si prosím nový vlastní PIN.</p>
      <form onsubmit="ulozitNovyPin(event)" class="space-y-3 text-xs">
        <input type="password" id="novy-pin-input" required maxlength="6" placeholder="Nový PIN" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-sm text-amber-400 font-mono">
        <button type="submit" id="btn-save-pin" class="w-full bg-amber-500 text-slate-950 font-bold p-3 rounded-lg">Uložit nový PIN</button>
      </form>
    </div>
  </div>

  <!-- HLAVNÍ APLIKACE PRO ŘIDIČE -->
  <div id="app-container" class="hidden max-w-4xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-amber-400"><i data-lucide="more-vertical"></i></button>
        <div>
          <h1 id="driver-header-title" class="text-xl font-bold text-amber-400">...</h1>
          <p id="driver-header-sub" class="text-xs text-slate-400">Vozidlo: ...</p>
        </div>
      </div>
      <button onclick="odhlasitRidice()" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 text-slate-300 text-xs flex items-center gap-1"><i data-lucide="log-out" class="w-4 h-4"></i> Odhlásit</button>
    </header>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/80 hidden z-40"></div>
    <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-900 border-r border-slate-800 z-50 p-5 flex flex-col justify-between transform -translate-x-full transition-transform duration-300 shadow-2xl">
      <div class="space-y-6 overflow-y-auto">
        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
          <h2 class="text-lg font-bold text-amber-400">Menu řidiče</h2>
          <button onclick="toggleSidebar()" class="text-slate-400"><i data-lucide="x"></i></button>
        </div>
        <nav class="space-y-2 text-sm font-medium">
          <button onclick="prepnoutSekciRidic('domu')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl bg-amber-500 text-slate-950 font-bold"><i data-lucide="home"></i> Hlavní panel</button>
          <button onclick="prepnoutSekciRidic('servisy')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="calendar"></i> Plánované servisy</button>
          <button onclick="prepnoutSekciRidic('stav')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="shield-check"></i> Stav vozu & Závady</button>
          <button onclick="prepnoutSekciRidic('dokumenty')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="file-text"></i> Dokumenty k vozu</button>
          <button onclick="prepnoutSekciRidic('kontakty')" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="phone"></i> Důležité kontakty</button>
        </nav>
      </div>
    </aside>

    <main class="space-y-4">
      <div id="sekce-domu" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
            <h3 class="text-md font-bold text-amber-400">Zadat tankování</h3>
            <form onsubmit="ulozitTankovani(event)" class="space-y-2">
              <input type="date" id="t-datum" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
              <input type="number" id="t-odo" placeholder="Stav ODO (km)" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
              <input type="number" step="0.01" id="t-litry" placeholder="Litry" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
              <input type="number" id="t-cena" placeholder="Cena celkem" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
              <input type="file" id="t-fotka" accept="image/*" required class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white text-xs">
              <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded">Uložit tankování</button>
            </form>
          </div>
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
            <h3 class="text-md font-bold text-amber-400">Aktualizovat ODO</h3>
            <form onsubmit="ulozitOdo(event)" class="space-y-2">
              <input type="number" id="o-odo" placeholder="Aktuální km" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono">
              <input type="file" id="o-fotka" accept="image/*" required class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-white text-xs">
              <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded mt-6">Aktualizovat ODO</button>
            </form>
          </div>
        </div>
      </div>

      <div id="sekce-servisy" class="space-y-3 hidden">
        <h2 class="text-lg font-bold text-amber-400">Plánované servisy</h2>
        <div id="driver-plan-list" class="space-y-2"></div>
      </div>

      <div id="sekce-stav" class="space-y-4 hidden">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
          <h3 class="text-md font-bold text-amber-400">Zbývající intervaly</h3>
          <div id="driver-intervals" class="grid grid-cols-2 gap-2"></div>
        </div>
      </div>

      <div id="sekce-dokumenty" class="space-y-3 hidden">
        <h2 class="text-lg font-bold text-amber-400">Dokumenty vozidla</h2>
        <div id="driver-docs-list" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs"></div>
      </div>

      <div id="sekce-kontakty" class="space-y-3 hidden">
        <h2 class="text-lg font-bold text-amber-400">Důležité kontakty</h2>
        <div id="driver-kontakty-list" class="space-y-2 text-xs"></div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = "https://script.google.com/macros/s/";
    const API_ID = "AKfycbzxo1uJ_ge4tkGLsdco088jJNdSJGLHk_ah55XYGtLBXV14CePgj2Quo9haLDX2no3g";
    const API_URL = API_BASE + API_ID + "/exec";
    let globalData = {}, currentRidic = null, currentAuto = null;

    window.onload = function() {
      fetch(API_URL + "?action=getData").then(r => r.json()).then(data => {
        globalData = data;
        const sel = document.getElementById('login-select-ridic');
        (data.ridici || []).forEach(r => { sel.innerHTML += `<option value="${r.id}">${r.jmeno}</option>`; });
        
        const savedRidicId = localStorage.getItem('kaja_ridic_id');
        if (savedRidicId) {
          const ridic = (data.ridici || []).find(r => r.id == savedRidicId);
          if (ridic) {
            currentRidic = ridic;
            currentAuto = (data.auta || []).find(a => a.id == ridic.prirazeneAutoId);
            zavestAplikaci();
            return;
          }
        }

        document.getElementById('login-loader').classList.add('hidden');
        document.getElementById('login-form').classList.remove('hidden');
      });
    };

    function prihlasitRidice(e) {
      e.preventDefault();
      const ridic = (globalData.ridici || []).find(r => r.id == document.getElementById('login-select-ridic').value);
      const pin = document.getElementById('login-pin').value.trim();

      if (!ridic || String(ridic.pin).trim() !== pin) { alert("Chybné jméno nebo PIN!"); return; }
      currentRidic = ridic;
      currentAuto = (globalData.auta || []).find(a => a.id == ridic.prirazeneAutoId);

      if (String(ridic.pin).trim() === "1111") {
        document.getElementById('modal-zmena-pinu').classList.remove('hidden');
        return;
      }
      
      localStorage.setItem('kaja_ridic_id', currentRidic.id);
      zavestAplikaci();
    }

    function ulozitNovyPin(e) {
      e.preventDefault();
      const novyPin = document.getElementById('novy-pin-input').value.trim();
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "updatePin", ridicId: currentRidic.id, novyPin: novyPin }) })
      .then(r => r.json()).then(res => {
        if (res.status === 'success') {
          currentRidic.pin = novyPin;
          document.getElementById('modal-zmena-pinu').classList.add('hidden');
          localStorage.setItem('kaja_ridic_id', currentRidic.id);
          zavestAplikaci();
        }
      });
    }

    function zavestAplikaci() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      document.getElementById('driver-header-title').innerText = currentRidic.jmeno;
      document.getElementById('driver-header-sub').innerText = currentAuto ? `Vozidlo: ${currentAuto.nazev} (${currentAuto.rz})` : "Bez vozu";
      vyrenderovatStavVozu();
      vyrenderovatDokumenty();
      vyrenderovatKontakty();
      vyrenderovatPlanyRidic();
      lucide.createIcons();
    }

    function odhlasitRidice() {
      localStorage.removeItem('kaja_ridic_id');
      location.reload();
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
    function prepnoutSekciRidic(s) {
      ['domu', 'servisy', 'stav', 'dokumenty', 'kontakty'].forEach(sec => { document.getElementById('sekce-' + sec).classList.add('hidden'); });
      document.getElementById('sekce-' + s).classList.remove('hidden');
      toggleSidebar();
    }

    function vyrenderovatKontakty() {
      const kont = document.getElementById('driver-kontakty-list'); kont.innerHTML = '';
      (globalData.kontakty || []).forEach(k => {
        kont.innerHTML += `
          <div class="bg-slate-800 p-3.5 rounded-xl flex justify-between items-center">
            <div>
              <strong class="text-white text-sm block">${k.jmeno}</strong>
              ${k.poznamka ? `<span class="text-slate-400 block">${k.poznamka}</span>` : ''}
              <span class="text-amber-400 font-mono">${k.telefon}</span>
            </div>
            <a href="tel:${k.telefon}" class="bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded font-bold">Zavolat</a>
          </div>
        `;
      });
    }

    function vyrenderovatStavVozu() {
      if (!currentAuto) return;
      const d = currentAuto.detailZbyva || {};
      document.getElementById('driver-intervals').innerHTML = `
        <div class="bg-slate-900 p-2 rounded">Olej: <strong>${d.olej ?? 'Neuvedeno'} km</strong></div>
        <div class="bg-slate-900 p-2 rounded">STK do: <strong>${currentApp?.stk || currentAuto.stk || 'Neuvedeno'}</strong></div>
      `;
    }

    function vyrenderovatDokumenty() {
      if (!currentAuto) return;
      document.getElementById('driver-docs-list').innerHTML = `
        <div class="bg-slate-800 p-3 rounded text-center space-y-2">
          <span>Malý TP (Přední)</span>
          ${currentAuto.malyTpPredniUrl ? `<a href="${currentAuto.malyTpPredniUrl}" target="_blank" class="block bg-emerald-500/20 text-emerald-400 p-1 rounded font-bold">Zobrazit</a>` : '<span class="text-slate-500">Nenahráno</span>'}
        </div>
      `;
    }

    function vyrenderovatPlanyRidic() {
      if (!currentAuto) return;
      const box = document.getElementById('driver-plan-list');
      const plany = (globalData.planovaneServisy || []).filter(p => p.autoId == currentAuto.id);
      if (plany.length === 0) { box.innerHTML = '<div class="text-xs text-slate-500 italic">Žádné naplánované servisy.</div>'; return; }
      box.innerHTML = '';
      plany.forEach(p => {
        box.innerHTML += `
          <div class="bg-slate-800 p-3 rounded text-xs space-y-1">
            <div class="flex justify-between font-bold text-white"><span>${p.ukon}</span><span class="text-amber-400 font-mono">${p.datumPlan}</span></div>
            ${p.poznamka ? `<div class="text-slate-400 italic">${p.poznamka}</div>` : ''}
          </div>
        `;
      });
    }

    function ulozitOdo(e) { e.preventDefault(); alert("ULOŽENO"); }
    function ulozitTankovani(e) { e.preventDefault(); alert("ULOŽENO"); }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrován:', reg.scope))
          .catch(err => console.log('Chyba SW:', err));
      });
    }
  </script>
</body>
</html>
