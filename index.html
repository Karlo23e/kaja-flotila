<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KaJa Admin - Flotila</title>

  <!-- PWA & Mobile Meta Tags pro Admin -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KaJa Admin">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" href="https://img.icons8.com/?size=512&id=mze1JcS3CX2Y&format=png&color=000000">
  <link rel="apple-touch-icon" href="https://img.icons8.com/?size=512&id=mze1JcS3CX2Y&format=png&color=000000">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 sm:p-6 font-sans pb-12">

  <header class="max-w-4xl mx-auto mb-6 flex justify-between items-center border-b border-slate-700 pb-4">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 text-amber-400">
        <i data-lucide="more-vertical" class="w-6 h-6"></i>
      </button>
      <div>
        <h1 id="header-title" class="text-2xl font-bold text-amber-400 flex items-center gap-2"><i data-lucide="truck"></i> KaJa Admin</h1>
        <p id="header-subtitle" class="text-xs text-slate-400">Správa a evidence flotily</p>
      </div>
    </div>
    <button onclick="nactiData()" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 text-slate-300">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
    </button>
  </header>

  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden"></div>
  <aside id="sidebar" class="fixed top-0 left-0 bottom-0 w-72 bg-slate-900 border-r border-slate-800 z-50 p-5 flex flex-col justify-between transform -translate-x-full transition-transform duration-300 shadow-2xl">
    <div class="space-y-6 overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-4">
        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2"><i data-lucide="menu" class="w-5 h-5"></i> Navigace</h2>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <nav class="space-y-2 text-sm font-medium">
        <button onclick="zvolitSekci('auta')" id="nav-btn-auta" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl bg-amber-500 text-slate-950 font-bold"><i data-lucide="truck" class="w-5 h-5"></i> Flotila vozidel</button>
        <button onclick="zvolitSekci('ridici')" id="nav-btn-ridici" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="users" class="w-5 h-5"></i> Správa řidičů</button>
        <button onclick="zvolitSekci('partneri')" id="nav-btn-partneri" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="map-pin" class="w-5 h-5"></i> Partnerské servisy</button>
        <button onclick="zvolitSekci('kontakty-admin')" id="nav-btn-kontakty-admin" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="phone" class="w-5 h-5"></i> Důležité kontakty</button>
        <button onclick="zvolitSekci('global-zavady')" id="nav-btn-global-zavady" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-300 hover:bg-slate-800"><i data-lucide="alert-triangle" class="w-5 h-5"></i> Nahlášené závady</button>
      </nav>
    </div>
  </aside>

  <main class="max-w-4xl mx-auto">
    <div id="loader" class="text-center py-12 text-slate-400">Načítám data...</div>

    <div id="sekce-auta" class="space-y-4 hidden">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-amber-400">Seznam vozidel</h2>
        <button onclick="otevritModalNoveAuto()" class="bg-amber-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5"><i data-lucide="plus" class="w-4 h-4"></i> Přidat auto</button>
      </div>
      <div id="grid-auta" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="sekce-ridici" class="space-y-4 hidden">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-amber-400">Seznam řidičů</h2>
        <button onclick="otevritModalNovyRidic()" class="bg-amber-500 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5"><i data-lucide="user-plus" class="w-4 h-4"></i> Přidat řidiče</button>
      </div>
      <div id="grid-ridici" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Původně uříznutá sekce Partnerů -->
    <div id="sekce-partneri" class="space-y-4 hidden">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-amber-400">Partnerské servisy</h2>
      </div>
      <div id="grid-partneri" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- SEKCE: SPRÁVA KONTAKTŮ V ADMINU -->
    <div id="sekce-kontakty-admin" class="space-y-4 hidden">
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700 space-y-3">
        <h3 class="text-md font-bold text-amber-400 flex items-center gap-2"><i data-lucide="phone-call" class="w-4 h-4"></i> Přidat důležitý kontakt pro řidiče</h3>
        <form onsubmit="ulozitKontaktAdmin(event)" class="space-y-3 text-xs">
          <div><label class="block text-slate-400 mb-1">Jméno / Název</label><input type="text" id="k-jmeno" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div>
          <div><label class="block text-slate-400 mb-1">Telefonní číslo</label><input type="text" id="k-tel" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white font-mono"></div>
          <div><label class="block text-slate-400 mb-1">Poznámka (např. Nonstop asistence)</label><input type="text" id="k-poznamka" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white"></div>
          <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded text-xs">Uložit kontakt</button>
        </form>
      </div>
      <div id="seznam-kontaktu-admin" class="space-y-2"></div>
    </div>

    <!-- Původně uříznutá sekce Závad -->
    <div id="sekce-global-zavady" class="space-y-3 hidden">
      <h2 class="text-lg font-bold text-amber-400">Nahlášené závady</h2>
      <div id="seznam-globalnich-zavad" class="space-y-3"></div>
    </div>
  </main>

  <!-- Modální okna pro admin -->
  <div id="modal-nove-auto" class="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 space-y-4 relative">
      <button type="button" onclick="zavritModalNoveAuto()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      <h3 class="text-lg font-bold text-amber-400">Přidat nové auto</h3>
      <form onsubmit="ulozitNoveAuto(event)" class="space-y-3 text-xs">
        <input type="text" id="auto-nazev" placeholder="Název" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white">
        <input type="text" id="auto-rz" placeholder="RZ / SPZ" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white font-mono">
        <input type="number" id="auto-odo" placeholder="Počáteční ODO km" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white font-mono">
        <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded">Uložit</button>
      </form>
    </div>
  </div>

  <div id="modal-novy-ridic" class="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 space-y-4 relative">
      <button type="button" onclick="zavritModalNovyRidic()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      <h3 class="text-lg font-bold text-amber-400">Přidat řidiče</h3>
      <form onsubmit="ulozitNovehoRidice(event)" class="space-y-3 text-xs">
        <input type="text" id="ridic-jmeno" placeholder="Jméno a příjmení" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white">
        <input type="text" id="ridic-tel" placeholder="Telefon" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white font-mono">
        <input type="text" id="ridic-pin" value="1111" required class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-amber-400 font-mono">
        <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold p-2.5 rounded">Uložit</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "https://script.google.com/macros/s/";
    const API_ID = "AKfycbzxo1uJ_ge4tkGLsdco088jJNdSJGLHk_ah55XYGtLBXV14CePgj2Quo9haLDX2no3g";
    const API_URL = API_BASE + API_ID + "/exec";
    let seznamAut = [], seznamRidicu = [], seznamPartneru = [], seznamKontaktu = [], seznamZavad = [];
    let aktivniSekce = 'auta';

    window.onload = function() { nactiData(); };

    function nactiData() {
      fetch(API_URL + "?action=getData").then(r => r.json()).then(data => {
        seznamAut = data.auta || [];
        seznamRidicu = data.ridici || [];
        seznamPartneru = data.partneri || [];
        seznamKontaktu = data.kontakty || [];
        seznamZavad = data.zavady || [];
        
        vyrenderovatAuta();
        vyrenderovatRidice();
        vyrenderovatKontaktyAdmin();
        vyrenderovatPartnery();
        vyrenderovatZavady();

        document.getElementById('loader').classList.add('hidden');
        prepnoutSekci(aktivniSekce);
        lucide.createIcons();
      });
    }

    function prepnoutSekci(s) {
      aktivniSekce = s;
      ['auta', 'ridici', 'partneri', 'kontakty-admin', 'global-zavady'].forEach(sec => {
        const el = document.getElementById('sekce-' + sec);
        if (el) el.classList.add('hidden');
      });
      const cilovaSekce = document.getElementById('sekce-' + s);
      if (cilovaSekce) cilovaSekce.classList.remove('hidden');
    }

    function zvolitSekci(s) {
      prepnoutSekci(s);
      toggleSidebar();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.toggle('hidden');
    }

    // Modalni funkce doplněny
    function otevritModalNoveAuto() {
      document.getElementById('modal-nove-auto').classList.remove('hidden');
    }

    function zavritModalNoveAuto() {
      document.getElementById('modal-nove-auto').classList.add('hidden');
    }

    function otevritModalNovyRidic() {
      document.getElementById('modal-novy-ridic').classList.remove('hidden');
    }

    function zavritModalNovyRidic() {
      document.getElementById('modal-novy-ridic').classList.add('hidden');
    }

    function vyrenderovatAuta() {
      const g = document.getElementById('grid-auta'); 
      if(!g) return;
      g.innerHTML = '';
      seznamAut.forEach(a => {
        g.innerHTML += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><strong>${a.nazev}</strong> (${a.rz})</div>`;
      });
    }

    function vyrenderovatRidice() {
      const g = document.getElementById('grid-ridici'); 
      if(!g) return;
      g.innerHTML = '';
      seznamRidicu.forEach(r => {
        g.innerHTML += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><strong>${r.jmeno}</strong><br>Tel: ${r.telefon} | PIN: ${r.pin}</div>`;
      });
    }

    function vyrenderovatPartnery() {
      const g = document.getElementById('grid-partneri');
      if(!g) return;
      g.innerHTML = '';
      if (seznamPartneru.length === 0) { 
        g.innerHTML = '<div class="text-slate-500 italic text-xs">Zatím žádné partnerské servisy.</div>'; 
        return; 
      }
      seznamPartneru.forEach(p => {
        g.innerHTML += `<div class="bg-slate-800 p-4 rounded-xl border border-slate-700"><strong>${p.nazev || p.jmeno || 'Servis'}</strong><br><span class="text-slate-400 text-xs">${p.adresa || p.telefon || ''}</span></div>`;
      });
    }

    function vyrenderovatZavady() {
      const g = document.getElementById('seznam-globalnich-zavad');
      if(!g) return;
      g.innerHTML = '';
      if (seznamZavad.length === 0) { 
        g.innerHTML = '<div class="text-slate-500 italic text-xs">Zatím žádné nahlášené závady.</div>'; 
        return; 
      }
      seznamZavad.forEach(z => {
        g.innerHTML += `<div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-sm"><strong>${z.auto || z.rz || 'Auto'}</strong><br><span class="text-amber-400">${z.zavada || z.popis || ''}</span></div>`;
      });
    }

    function vyrenderovatKontaktyAdmin() {
      const kont = document.getElementById('seznam-kontaktu-admin');
      if(!kont) return;
      kont.innerHTML = '';
      if (seznamKontaktu.length === 0) { kont.innerHTML = '<div class="text-slate-500 italic text-xs">Zatím žádné kontakty.</div>'; return; }
      seznamKontaktu.forEach(k => {
        kont.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
            <div>
              <strong class="text-white text-sm block">${k.jmeno}</strong>
              ${k.poznamka ? `<span class="text-slate-400 block">${k.poznamka}</span>` : ''}
              <span class="text-amber-400 font-mono">${k.telefon}</span>
            </div>
            <button onclick="smazatKontaktAdmin('${k.id}')" class="bg-red-500/20 text-red-400 p-2 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function ulozitKontaktAdmin(e) {
      e.preventDefault();
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: "createKontakt",
          jmeno: document.getElementById('k-jmeno').value,
          telefon: document.getElementById('k-tel').value,
          poznamka: document.getElementById('k-poznamka').value
        })
      }).then(r => r.json()).then(res => { 
        if (res.status === 'success') {
          e.target.reset();
          nactiData(); 
        }
      });
    }

    function smazatKontaktAdmin(id) {
      if (!confirm("Smazat kontakt?")) return;
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "deleteKontakt", kontaktId: id }) })
      .then(r => r.json()).then(res => { if (res.status === 'success') nactiData(); });
    }

    function ulozitNoveAuto(e) {
      e.preventDefault();
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "createAuto", nazev: document.getElementById('auto-nazev').value, rz: document.getElementById('auto-rz').value, odo: document.getElementById('auto-odo').value }) })
      .then(r => r.json()).then(res => { 
        if (res.status === 'success') {
          e.target.reset();
          zavritModalNoveAuto();
          nactiData(); 
        }
      });
    }

    function ulozitNovehoRidice(e) {
      e.preventDefault();
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "createRidic", jmeno: document.getElementById('ridic-jmeno').value, telefon: document.getElementById('ridic-tel').value, pin: document.getElementById('ridic-pin').value }) })
      .then(r => r.json()).then(res => { 
        if (res.status === 'success') {
          e.target.reset();
          zavritModalNovyRidic();
          nactiData(); 
        }
      });
    }
  </script>
</body>
</html>
